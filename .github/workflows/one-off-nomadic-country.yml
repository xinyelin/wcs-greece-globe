name: One-off Gallery Nomadic country snapshot

on:
  push:
    paths:
      - ".github/workflows/one-off-nomadic-country.yml"

permissions:
  contents: write

jobs:
  update-generated-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply canonical Nomadic country to generated HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '"location":"Nomadic","continent":"Nomadic","country":null'
          new = '"location":"Nomadic","continent":"Nomadic","country":"Nomadic"'

          for filename in ("index.html", "classic.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              matches = text.count(old)
              if matches != 1:
                  raise SystemExit(f"{filename}: expected exactly 1 Nomadic null-country record, found {matches}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit generated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html classic.html
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate gallery with Nomadic country"
          git push origin HEAD:main
